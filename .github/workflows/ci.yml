name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rootpassword
          MARIADB_DATABASE: zploy
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -prootpassword" --health-interval=5s --health-timeout=2s --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Compilation
        run: cargo check --verbose

      - name: Run Tests
        env:
          DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/zploy
        run: cargo test --verbose -- --test-threads=1
