name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: zploy-linux-x86_64.tar.gz
            binary_name: zploy
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: zploy-windows-x86_64.zip
            binary_name: zploy.exe
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: zploy-macos-arm64.tar.gz
            binary_name: zploy
            use_cross: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/
          cp -r config/config.example.toml dist/config.example.toml
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Unix
        if: matrix.os != 'windows-latest'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/
          cp config/config.example.toml dist/config.example.toml
          tar -czvf ${{ matrix.artifact_name }} -C dist .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
