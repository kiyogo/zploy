<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="zpCyan" x1="0%" y1="0%" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="zpLightning" x1="0%" y1="0%" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="zpViolet" x1="0%" y1="0%" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="zpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isometric 'Z' Deployment Symbol - Crisp transparent vector with zero background box -->
  <g transform="translate(4, 2) scale(0.85)" filter="url(#zpGlow)">
    <!-- Shadow Layer -->
    <path d="M 12,8 L 44,8 L 50,18 L 22,44 L 50,44 L 46,52 L 12,52 L 6,42 L 32,16 L 8,16 Z"
          fill="url(#zpViolet)" opacity="0.25"/>
    <!-- Top arm -->
    <path d="M 12,8 L 48,8 L 42,18 L 20,18 Z" fill="url(#zpCyan)"/>
    <!-- Diagonal spine -->
    <path d="M 48,8 L 16,48 L 28,48 L 54,16 L 42,18 Z" fill="url(#zpLightning)"/>
    <!-- Bottom arm -->
    <path d="M 16,48 L 50,48 L 44,38 L 24,38 Z" fill="url(#zpViolet)"/>
  </g>
</svg>
