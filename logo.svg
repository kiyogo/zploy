<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="zpBg" x1="0%" y1="0%" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradient 1 (Cyan to Blue) -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Accent Gradient 2 (Electric Violet to Indigo) -->
    <linearGradient id="violetIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow Gradient -->
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean Squircle Container -->
  <rect width="220" height="220" rx="48" fill="url(#zpBg)"/>
  <rect x="1" y="1" width="218" height="218" rx="47" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2"/>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="110" cy="110" r="70" fill="url(#cyanBlue)" opacity="0.12" />
  <circle cx="130" cy="90" r="50" fill="url(#violetIndigo)" opacity="0.15" />

  <!-- ICON: Geometric Isometric 'Z' Deployment Emblem -->
  <g transform="translate(40, 20)">
    <!-- Base Layer Polygon -->
    <path d="M 30,30 L 110,30 L 130,58 L 58,130 L 130,130 L 120,154 L 30,154 L 10,126 L 82,54 L 20,54 Z"
          fill="url(#violetIndigo)" opacity="0.35" filter="url(#glow)"/>

    <!-- Upper Arm of Z -->
    <path d="M 32,32 L 122,32 L 106,62 L 56,62 Z" fill="url(#cyanBlue)" />

    <!-- Diagonal Lightning Spine of Z -->
    <path d="M 122,32 L 40,148 L 74,148 L 140,54 L 106,62 Z" fill="url(#lightningGrad)" />

    <!-- Lower Arm of Z -->
    <path d="M 40,148 L 130,148 L 114,118 L 64,118 Z" fill="url(#violetIndigo)" />
  </g>
</svg>
