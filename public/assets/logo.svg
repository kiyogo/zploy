<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradient 1 (Cyan to Blue) -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Accent Gradient 2 (Electric Violet to Indigo) -->
    <linearGradient id="violetIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow Gradient -->
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.74  0 0 0 0 0.97  0 0 0 0.35 0"/>
      <feBlend in="SourceGraphic" in2="blur" mode="normal" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="110" cy="110" r="70" fill="url(#cyanBlue)" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="130" cy="90" r="50" fill="url(#violetIndigo)" opacity="0.18" filter="url(#softGlow)" />

  <!-- ICON: Geometric Isometric 'Z' Deployment Emblem -->
  <g transform="translate(40, 30)">
    <!-- Base Layer Polygon -->
    <path d="M 30,30 L 110,30 L 130,58 L 58,130 L 130,130 L 120,154 L 30,154 L 10,126 L 82,54 L 20,54 Z"
          fill="url(#violetIndigo)" opacity="0.35" filter="url(#glow)"/>

    <!-- Upper Arm of Z -->
    <path d="M 32,32 L 122,32 L 106,62 L 56,62 Z" fill="url(#cyanBlue)" />

    <!-- Diagonal Lightning Spine of Z -->
    <path d="M 122,32 L 40,148 L 74,148 L 140,54 L 106,62 Z" fill="url(#lightningGrad)" />

    <!-- Lower Arm of Z -->
    <path d="M 40,148 L 130,148 L 114,118 L 64,118 Z" fill="url(#violetIndigo)" />

    <!-- Glowing Speed Particles / Pulse Nodes -->
    <circle cx="122" cy="32" r="4.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="40" cy="148" r="4.5" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="106" cy="62" r="3" fill="#ffffff" />
    <circle cx="64" cy="118" r="3" fill="#ffffff" />
  </g>

  <!-- BRAND NAME & TAGLINE TYPOGRAPHY -->
  <g transform="translate(210, 42)">
    <!-- Main Title: ZPLOY -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="76" font-weight="900" letter-spacing="-0.03em" fill="#ffffff">
      Z<tspan fill="url(#cyanBlue)">PLOY</tspan>
    </text>

    <!-- Version / Badge Tag -->
    <g transform="translate(285, 30)">
      <rect x="0" y="0" width="68" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
      <text x="34" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
            font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.05em">v0.1.0</text>
    </g>

    <!-- Subtitle -->
    <text x="2" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="20" font-weight="500" fill="#94a3b8" letter-spacing="0.02em">
      Blazing Fast &amp; Ultra-Lightweight Web Hosting Server in <tspan fill="#f97316" font-weight="700">Rust</tspan>
    </text>
  </g>
</svg>
