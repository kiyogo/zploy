<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zploy Server</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            text-align: center;
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: #38bdf8;
        }
        p {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
            margin: 0 0 28px 0;
        }
        a {
            display: inline-block;
            background: #0284c7;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        a:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Zploy Server</h1>
        <p>No website has been published at the root path (/).<br>Administrator, please visit the Admin Dashboard to publish a site.</p>
        <a href="/admin">Go to Admin Dashboard (/admin)</a>
    </div>
</body>
</html>
